<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号 · Trae Relay Web</title><meta name="color-scheme" content="dark"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
