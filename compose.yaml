services:
  relay:
    build: .
    ports:
      - "0.0.0.0:8317:8317"
    env_file:
      - .env
    environment:
      RELAY_LISTEN: "0.0.0.0:8317"
      # 签到与日志按本地时间计算，默认北京时间；可在 .env 覆盖 TZ。
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - relay-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 20s
volumes:
  relay-data:
